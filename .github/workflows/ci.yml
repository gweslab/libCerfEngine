name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86-msvc, os: windows-latest, cmake_args: "-A Win32" }
          - { name: windows-x64-msvc, os: windows-latest, cmake_args: "-A x64" }
          - { name: windows-arm64-msvc, os: windows-11-arm, cmake_args: "-A ARM64" }
          - { name: linux-x64-gcc, os: ubuntu-latest, cmake_args: "-DCMAKE_CXX_COMPILER=g++" }
          - { name: linux-x64-clang, os: ubuntu-latest, cmake_args: "-DCMAKE_CXX_COMPILER=clang++" }
          - { name: linux-arm64-gcc, os: ubuntu-24.04-arm, cmake_args: "-DCMAKE_CXX_COMPILER=g++" }
          - { name: linux-arm64-clang, os: ubuntu-24.04-arm, cmake_args: "-DCMAKE_CXX_COMPILER=clang++" }
          - { name: macos-arm64-clang, os: macos-latest, cmake_args: "" }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure
